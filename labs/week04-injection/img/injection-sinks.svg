  <marker id="hb" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="9.5" refY="5" orient="auto">
    <path class="mkb" d="M0,0.6 L9.5,5 L0,9.4 Z"/>
  </marker>
</defs>

<rect class="bg" x="0" y="0" width="720" height="500"/>

<text class="ttl" x="16" y="28">One request, three security sinks</text>
<text class="sub" x="16" y="47">Week 4 · OWASP A05 Injection · CWE-89 · CWE-78 · CWE-434</text>

<text class="colh" x="16" y="68">SOURCE</text>
<text class="colh" x="224" y="68">THE SINK — vulnerable_app.py</text>
<text class="colh" x="486" y="68">THE CONTROL — solution_app.py</text>

<!-- SOURCE -->
<rect class="box src" x="16" y="132" width="112" height="168" rx="8"/>
<text class="hO" x="72" y="162" text-anchor="middle">Untrusted</text>
<text class="hO" x="72" y="178" text-anchor="middle">input</text>
<text class="code" x="72" y="202" text-anchor="middle">request.args</text>
<text class="code" x="72" y="218" text-anchor="middle">request.files</text>
<text class="body" x="72" y="246" text-anchor="middle">request data</text>
<text class="body" x="72" y="261" text-anchor="middle">reaches three</text>
<text class="body" x="72" y="276" text-anchor="middle">sinks</text>

<!-- FAN ARROWS -->
<path class="ao" d="M128,192 L140,192 L140,120 L220,120" marker-end="url(#ho)"/>
<path class="ao" d="M128,216 L220,216" marker-end="url(#ho)"/>
<path class="ao" d="M128,240 L140,240 L140,312 L220,312" marker-end="url(#ho)"/>

<text class="rel"  x="184" y="100" text-anchor="middle">becomes</text>
<text class="relk" x="184" y="112" text-anchor="middle">SQL code</text>
<text class="rel"  x="184" y="196" text-anchor="middle">becomes</text>
<text class="relk" x="184" y="208" text-anchor="middle">shell code</text>
<text class="rel"  x="184" y="292" text-anchor="middle">becomes a</text>
<text class="relk" x="184" y="304" text-anchor="middle">file path</text>

<!-- SINK 1 : SQL -->
<rect class="box sink" x="224" y="78" width="244" height="84" rx="8"/>
<polygon class="warn" points="243,85 251,100 235,100"/>
<rect class="warni" x="242.2" y="90" width="1.7" height="5"/>
<rect class="warni" x="242.2" y="97" width="1.7" height="1.7"/>
<text class="hD" x="258" y="99">SQL engine · SQLite</text>
<rect class="badge" x="396" y="86" width="62" height="17" rx="8.5"/>
<text class="cwe" x="427" y="98.5" text-anchor="middle">CWE-89</text>
<text class="codeo" x="236" y="119">"WHERE username='%s'" % user</text>
<text class="mut" x="236" y="134">same flaw in /search — UNION SELECT</text>
<text x="236" y="152"><tspan class="mut">payload</tspan><tspan class="pay" dx="6">/login?user=x' OR '1'='1'--</tspan></text>

<!-- SINK 2 : SHELL -->
<rect class="box sink" x="224" y="174" width="244" height="84" rx="8"/>
<polygon class="warn" points="243,181 251,196 235,196"/>
<rect class="warni" x="242.2" y="186" width="1.7" height="5"/>
<rect class="warni" x="242.2" y="193" width="1.7" height="1.7"/>
<text class="hD" x="258" y="195">OS shell · sh -c</text>
<rect class="badge" x="396" y="182" width="62" height="17" rx="8.5"/>
<text class="cwe" x="427" y="194.5" text-anchor="middle">CWE-78</text>
<text class="codeo" x="236" y="215">run("ping -c 1 " + host,</text>
<text class="codeo" x="252" y="230">shell=True)</text>
<text x="236" y="248"><tspan class="mut">payload</tspan><tspan class="pay" dx="6">/ping?host=127.0.0.1;id</tspan></text>

<!-- SINK 3 : FILESYSTEM -->
<rect class="box sink" x="224" y="270" width="244" height="84" rx="8"/>
<polygon class="warn" points="243,277 251,292 235,292"/>
<rect class="warni" x="242.2" y="282" width="1.7" height="5"/>
<rect class="warni" x="242.2" y="289" width="1.7" height="1.7"/>
<text class="hD" x="258" y="291">Filesystem write</text>
<rect class="badge" x="392" y="278" width="66" height="17" rx="8.5"/>
<text class="cwe" x="425" y="290.5" text-anchor="middle">CWE-434</text>
<text class="codeo" x="236" y="311">dest = os.path.join(UPLOAD_DIR,</text>
<text class="codeo" x="252" y="326">f.filename)  # any name/ext</text>
<text x="236" y="344"><tspan class="mut">payload</tspan><tspan class="pay" dx="6">POST /upload  f=shell.py</tspan></text>

<!-- SINK -> CONTROL -->
<path class="ab" d="M468,120 L482,120" marker-end="url(#hb)"/>
<path class="ab" d="M468,216 L482,216" marker-end="url(#hb)"/>
<path class="ab" d="M468,312 L482,312" marker-end="url(#hb)"/>

<!-- CONTROL 1 -->
<rect class="box ctrl" x="486" y="78" width="218" height="84" rx="8"/>
<polyline class="chk" points="498,91 503,96 511,86"/>
<text class="hB" x="517" y="96">Parameterised query</text>
<text class="codeb" x="498" y="118">execute(sql, (user, pw))</text>
<text class="body" x="498" y="135">bound as data, not syntax —</text>
<text class="body" x="498" y="150">quotes lose their power</text>

<!-- CONTROL 2 -->
<rect class="box ctrl" x="486" y="174" width="218" height="84" rx="8"/>
<polyline class="chk" points="498,187 503,192 511,182"/>
<text class="hB" x="517" y="192">Argument vector</text>
<text class="codeb" x="498" y="214">["ping","-c","1",host]</text>
<text class="body" x="498" y="231">shell=False + regex allow-list</text>
<text class="body" x="498" y="246">no shell left to read ';'</text>

<!-- CONTROL 3 -->
<rect class="box ctrl" x="486" y="270" width="218" height="84" rx="8"/>
<polyline class="chk" points="498,283 503,288 511,278"/>
<text class="hB" x="517" y="288">Constrain upload</text>
<text class="codeb" x="498" y="310">secure_filename(name)</text>
<text class="body" x="498" y="327">ext in .txt .png .jpg .pdf</text>
<text class="body" x="498" y="342">shell.py rejected — 400</text>

<!-- CONCLUSION -->
<rect class="box foot" x="16" y="376" width="688" height="92" rx="8"/>
<circle class="xr" cx="46" cy="406" r="13" fill="none"/>
<path class="xm" d="M40,400 L52,412 M52,400 L40,412"/>
<text class="hO" x="72" y="404">One filter cannot guard all three sinks</text>
<text class="body" x="72" y="424">Escaping quotes does nothing to ';' in a shell, and a safe</text>
<text class="body" x="72" y="440">filename does nothing to SQL. Control each sink separately.</text>
<text class="fmono" x="72" y="458">fixes: solution_app.py L52-55 + L62-66 · L74-77 · L86-93</text>
</svg>
