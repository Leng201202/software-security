<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-label="Week 4 injection lab: untrusted request data reaches three security sinks. SQL string concatenation allows login bypass and UNION injection; bound parameters keep values as data. shell=True allows command injection; an argument list with shell=False avoids shell interpretation. Unrestricted file upload accepts shell.py; the reference fixes the filename and extension and stores outside a served directory. Each sink requires its own control.">
<title>Untrusted request data reaches three security sinks in the Week 4 lab</title>
