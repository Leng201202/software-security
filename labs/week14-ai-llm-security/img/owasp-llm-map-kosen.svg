  <text class="idO"  x="28" y="387">LLM05</text><text class="nm" x="80" y="387">Improper Output Handling</text>
  <text class="chipO" x="28" y="406">Task 2 — reflected XSS on :8082</text>
  <text class="note"  x="28" y="423">fix escape() — checked in Task 5</text>

  <!-- RIGHT COLUMN: LLM06-10 -->
  <rect class="box talk" x="368" y="70" width="336" height="66" rx="8"/>
  <text class="idB"  x="380" y="91">LLM06</text><text class="nm" x="432" y="91">Excessive Agency</text>
  <text class="chipB" x="380" y="110">written: worksheet Part 2 Q5</text>
  <text class="note"  x="380" y="127">tools, MCP, least privilege — no agent in the lab</text>

  <rect class="box talk" x="368" y="144" width="336" height="66" rx="8"/>
  <text class="idB"  x="380" y="165">LLM07</text><text class="nm" x="432" y="165">System Prompt Leakage</text>
  <rect class="newb" x="604" y="154" width="38" height="15" rx="3"/><text class="newt" x="623" y="165" text-anchor="middle">NEW</text>
  <text class="chipB" x="380" y="184">why Task 1 works: secret in SYSTEM_PROMPT</text>
  <text class="note"  x="380" y="201">local mock: LLM01 → LLM02</text>

  <rect class="box talk" x="368" y="218" width="336" height="66" rx="8"/>
  <text class="idB"  x="380" y="239">LLM08</text><text class="nm" x="432" y="239">Vector &amp; Embedding Weaknesses</text>
  <text class="chipB" x="380" y="258">discussion: the RAG side of Task 3</text>
  <text class="note"  x="380" y="275">Task 3: optional design exercise</text>

  <rect class="box none" x="368" y="292" width="336" height="66" rx="8"/>
  <text class="idN"  x="380" y="313">LLM09</text><text class="nmN" x="432" y="313">Misinformation</text>
  <text class="chipN" x="380" y="332">not this week</text>

