<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 486" role="img" aria-label="The OWASP Top 10 for LLM Applications, 2025 edition, as a map of where each item shows up in this week. Solid orange tiles are the shared local mock core, dashed blue tiles are written or discussion only, grey tiles are not covered this week. LLM01 Prompt Injection, hands-on: Task 1 on port 8082; Agent Breaker and indirect-injection Task 3 are optional extensions. LLM02 Sensitive Information Disclosure, hands-on: Task 1 leaks the FLAG; the fix, redact_secret, is checked in Task 5. LLM03 Supply Chain: not this week; software supply chain was Week 12. LLM04 Data and Model Poisoning: not this week. LLM05 Improper Output Handling, hands-on: Task 2 reflected XSS; the fix, escape, is checked in Task 5. LLM06 Excessive Agency, written: worksheet Part 2 question 5, on tools, MCP and least privilege. LLM07 System Prompt Leakage, new in 2025: it is why Task 1 works, because the secret sits in SYSTEM_PROMPT, local mock observation: LLM01 leading to LLM02. LLM08 Vector and Embedding Weaknesses: discussion, the RAG side of optional Task 3. LLM09 Misinformation: not this week. LLM10 Unbounded Consumption: discussion only, runaway agent cost, no task. Footer: use the 2025 taxonomy for this course; local mock results do not establish real LLM, RAG or tool security.">
  <title>OWASP LLM Top 10 (2025) — where each one shows up this week</title>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .bg    { fill:#ffffff; }
    .ttl   { fill:#111827; font-size:18px; font-weight:700; }
    .sub   { fill:#6b7280; font-size:12px; }
    .box   { stroke-width:1.6; }
    .hands { fill:#fff7f3; stroke:#E35205; stroke-width:2.2; }
    .talk  { fill:#f1f8fd; stroke:#017BC4; stroke-dasharray:6 4; }
    .none  { fill:#f6f7f8; stroke:#c9ced4; }
    .idO   { fill:#b23f00; font-size:13px; font-weight:700; }
    .idB   { fill:#015a8f; font-size:13px; font-weight:700; }
    .idN   { fill:#9aa3ad; font-size:13px; font-weight:700; }
    .nm    { fill:#111827; font-size:13px; font-weight:700; }
    .nmN   { fill:#6b7280; font-size:13px; font-weight:600; }
    .chipO { fill:#b23f00; font-size:11.5px; font-weight:700; }
    .chipB { fill:#015a8f; font-size:11.5px; font-weight:700; }
    .chipN { fill:#9aa3ad; font-size:11.5px; }
    .note  { fill:#374151; font-size:11px; }
    .newb  { fill:#E35205; }
    .newt  { fill:#ffffff; font-size:9.5px; font-weight:700; letter-spacing:.4px; }
    .foot  { fill:#6b7280; font-size:11.5px; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill:#11151a; }
      .ttl, .nm { fill:#e9edf2; }
      .sub, .foot, .nmN { fill:#9aa3ad; }
      .hands { fill:#2b1a12; stroke:#ff7a3d; }
      .talk  { fill:#122633; stroke:#4aa3dd; }
      .none  { fill:#161b21; stroke:#33404c; }
      .idO, .chipO { fill:#ff7a3d; }
      .idB, .chipB { fill:#4aa3dd; }
      .idN, .chipN { fill:#6b7682; }
      .note  { fill:#c4ccd4; }
      .newb  { fill:#ff7a3d; }
      .newt  { fill:#11151a; }
    }

/* Emphasis only: every element remains complete without animation.
   Stroke/fill colours inherit the light and dark house palettes above. */
.lesson-step { animation: lesson-step 6s ease-in-out infinite; }
.lesson-second { animation-delay: 2s; }
.lesson-third { animation-delay: 4s; }
@keyframes lesson-step {
  0%, 30%, 100% { stroke-width: 2.2; }
  14% { stroke-width: 3.4; }
}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>

  <rect class="bg" x="0" y="0" width="720" height="486"/>

  <text class="ttl" x="16" y="30">OWASP LLM Top 10 (2025): where each one shows up this week</text>
