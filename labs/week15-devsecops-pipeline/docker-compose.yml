x-runtime: &runtime
  image: kosen-swsec-week15:local
  build:
    context: .
    dockerfile: Dockerfile

services:
  insecure-service:
    <<: *runtime
    working_dir: /lab
    volumes:
      - ./:/lab
    ports:
      # 127.0.0.1 = this machine only. Lab apps are deliberately vulnerable; keep them off the classroom network.
      - "127.0.0.1:8090:8090"
    # PRACTICE build: with no .env the app serves public demo flags (FLAG{..._demo}).
    # Graded flags come only from your hosted CTFd instance, never from this local run.
    environment:
      - FLAG_DEVSECOPS
    command: python insecure_service.py

  secure-service:
    <<: *runtime
    working_dir: /lab
    volumes:
      - ./:/lab
    ports:
      # 127.0.0.1 = this machine only. Lab apps are deliberately vulnerable; keep them off the classroom network.
      - "127.0.0.1:8091:8091"
    # PRACTICE build: with no .env the app serves public demo flags (FLAG{..._demo}).
    # Graded flags come only from your hosted CTFd instance, never from this local run.
    environment:
      - FLAG_DEVSECOPS
    command: python secure_service.py
