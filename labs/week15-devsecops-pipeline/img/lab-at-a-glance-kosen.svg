<rect class="bg" x="0" y="0" width="960" height="524"/>

<text class="h1"  x="24" y="34">Task 1b at a glance: same request, two services</text>
<text class="sub" x="24" y="55">Both containers use the same image and mount the same lab folder. Only the Python file they run differs.</text>

<!-- step labels -->
<text class="step" x="24"  y="88">① START BOTH</text>
<text class="step" x="250" y="88">TWO CONTAINERS</text>
<text class="step" x="566" y="88">② GET /admin, NO TOKEN  ·  ③ READ THE LOGS</text>

<!-- ① terminal -->
<rect class="term" x="24" y="100" width="196" height="306" rx="8"/>
<text class="tm" x="38" y="124">in the lab folder:</text>
<text class="tp mono" x="38" y="150">$ docker compose up \</text>
<text class="tm mono" x="38" y="176">  --no-build --pull never</text>
<text class="tm" x="38" y="194">mounts ./ as /lab</text>
<text class="tm" x="38" y="212">Flask prebuilt in image</text>
<text class="tt mono" x="38" y="246">--- INSECURE service</text>
<text class="tt mono" x="38" y="264">    on :8090 ---</text>
<text class="tt mono" x="38" y="296">--- SECURE service</text>
<text class="tt mono" x="38" y="314">    on :8091 ---</text>
<text class="tm" x="38" y="350">compose -p &lt;name&gt; down</text>
<text class="tm" x="38" y="368">when you finish</text>

<path class="wire" fill="none" d="M220 172 H242"/>
<polygon class="head" points="241,166.5 241,177.5 248,172"/>
<path class="wire" fill="none" d="M220 334 H242"/>
<polygon class="head" points="241,328.5 241,339.5 248,334"/>

<!-- containers -->
<rect class="cbad" x="250" y="100" width="300" height="146" rx="8"/>
<text class="hbad" x="264" y="124">FAILS OPEN</text>
<text class="port mono" x="372" y="124">localhost:8090</text>
<text class="cm mono" x="264" y="144">insecure-service · insecure_service.py</text>
<text class="code mono" x="264" y="172">user = USERS[token]</text>
<text class="cm" x="264" y="189">no token → KeyError</text>
<text class="code mono" x="264" y="213">except Exception:</text>
<text class="code mono" x="264" y="230">  return …UNLOCKED, SECRET</text>

<rect class="cok" x="250" y="260" width="300" height="146" rx="8"/>
<text class="hok" x="264" y="284">FAILS CLOSED</text>
<text class="port mono" x="384" y="284">localhost:8091</text>
<text class="cm mono" x="264" y="304">secure-service · secure_service.py</text>
<text class="code mono" x="264" y="332">user = USERS.get(token)</text>
<text class="cm" x="264" y="349">no token → None, never raises</text>
<text class="code mono" x="264" y="373">security_log.warning(…)</text>
<text class="code mono" x="264" y="390">return …forbidden, 403</text>

<path class="wire" fill="none" d="M550 172 H558"/>
<polygon class="head" points="557,166.5 557,177.5 564,172"/>
<path class="wire" fill="none" d="M550 334 H558"/>
<polygon class="head" points="557,328.5 557,339.5 564,334"/>

<!-- results -->
<rect class="panel" x="564" y="100" width="372" height="146" rx="8"/>
<text class="lbl" x="578" y="122">RESPONSE</text>
<text class="rbad mono" x="578" y="142">200 {"panel":"UNLOCKED",</text>
<text class="rbad mono" x="578" y="160">     "secret":"FLAG{devsecops_…}"}</text>
<text class="lbl" x="578" y="188">DOCKER COMPOSE LOGS</text>
<text class="logq mono" x="578" y="207">"GET /admin HTTP/1.1" 200 -</text>
<text class="note" x="578" y="232">Only the access line. The attack looks like a success (A09).</text>

<rect class="panel" x="564" y="260" width="372" height="146" rx="8"/>
<text class="lbl" x="578" y="282">RESPONSE</text>
<text class="rok mono" x="578" y="302">403 {"error":"forbidden"}</text>
<text class="lbl" x="578" y="330">DOCKER COMPOSE LOGS</text>
<text class="logw mono" x="578" y="349">level=WARNING logger=security</text>
<text class="logw mono" x="578" y="366">event=authz_failure outcome=deny</text>
<text class="logw mono" x="578" y="383">src_ip=… reason=unauthenticated</text>
<text class="logq mono" x="578" y="399">… "GET /admin HTTP/1.1" 403 -</text>

<!-- ④ anti-cheat + evidence -->
<rect class="strip" x="24" y="422" width="912" height="88" rx="8"/>
<text class="step" x="40" y="446">④ PROVE THE FIX KEEPS ADMINS IN</text>
<text class="sb" x="40" y="467">The same request with alice-token still unlocks :8091.</text>
<text class="sb" x="40" y="484">Local checks must show rejected bypasses together with</text>
<text class="sb" x="40" y="501">a legitimate admin still getting in.</text>
<text class="st" x="620" y="446">Submit for Task 1b</text>
<text class="sm" x="620" y="467">the flag · both responses · the except</text>
<text class="sm" x="620" y="484">line in insecure_service.py that fails open</text>
<text class="sm" x="620" y="501">local = demo · personal only if issued</text>
</svg>
