<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 524" role="img" aria-label="Task 1b at a glance. Build the image before class; Flask is already inside it. From the lab folder, docker compose up with no-build and pull-never starts two containers from that same image. Both mount the lab folder. The insecure service runs insecure_service.py on port 8090 and the secure service runs secure_service.py on port 8091. Send GET /admin without a token to both: port 8090 returns 200 and a demo secret because its exception path grants access; port 8091 returns 403 and logs a safe denial event. Then verify alice-token still unlocks port 8091. The local flag is a public demo value; use a personal flag only when an instance has actually been issued.">
<title>Task 1b at a glance: one compose file, two services, the same request</title>
