<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-label="Browser controls apply to browser interactions. Direct API clients can choose paths and fields. The server must verify identity, authorize each object and allow only intended bindable fields.">
  <title>Server-side API authorization</title>
  <style>
    .bg     { fill:#ffffff; }
    .title  { fill:#111827; font:700 19px system-ui,sans-serif; }
    .sub    { fill:#6b7280; font:400 12.5px system-ui,sans-serif; }
    .colh   { fill:#4b5563; font:700 13px system-ui,sans-serif; letter-spacing:0.4px; text-anchor:middle; }
    .mono   { font-family:ui-monospace,Menlo,Consolas,monospace; }

    .node   { fill:#f6f8fa; stroke:#9aa3ad; stroke-width:1.8; }
    .nodeh  { fill:#0f2233; font:700 12.5px system-ui,sans-serif; text-anchor:middle; }
    .nodes  { fill:#6b7280; font:400 10.5px system-ui,sans-serif; text-anchor:middle; }

    .shield { fill:#f2f8fc; stroke:#017BC4; stroke-width:2; }
    .shieldh{ fill:#015a8f; font:700 12px system-ui,sans-serif; text-anchor:middle; }
    .shieldl{ fill:#374151; font:400 10.5px system-ui,sans-serif; text-anchor:middle; }

    .raw    { fill:#fff6f1; stroke:#E35205; stroke-width:2; }
    .rawh   { fill:#b23f00; font:700 12px system-ui,sans-serif; text-anchor:middle; }
    .rawl   { fill:#374151; font:400 10.5px system-ui,sans-serif; text-anchor:middle; }

    .srv    { fill:#eef1f4; stroke:#5b6670; stroke-width:1.8; }
    .srvh   { fill:#0f2233; font:700 12px system-ui,sans-serif; text-anchor:middle; }

    .arrowG { stroke:#017BC4; stroke-width:2.5; fill:none; }
    .ahG    { fill:#017BC4; }
    .arrowA { stroke:#E35205; stroke-width:2.5; fill:none; }
    .ahA    { fill:#E35205; }
    .divide { stroke:#d7dde3; stroke-width:1.5; stroke-dasharray:4 4; }

    .conseq { fill:#fff6f1; stroke:#E35205; stroke-width:1.6; }
    .conseqacc { fill:#E35205; }
    .conseqt{ fill:#b23f00; font:700 11px system-ui,sans-serif; }
    .conseql{ fill:#374151; font:400 10.5px system-ui,sans-serif; }

    .banner { fill:#f4f9fd; stroke:#017BC4; stroke-width:2; }
    .bant   { fill:#0f2233; font:700 13px system-ui,sans-serif; }
    .banl   { fill:#374151; font:400 11.5px system-ui,sans-serif; }

  </style>

  <rect class="bg" x="0" y="0" width="720" height="430"/>

  <defs>
    <marker id="wahG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahG" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="wahA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahA" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <!-- ============ HEADER ============ -->
  <text class="title" x="30" y="32">API clients can bypass browser controls</text>
  <text class="sub" x="30" y="54">Week 10 · server-side authorization is required on every request</text>

  <line class="divide" x1="360" y1="74" x2="360" y2="352"/>
  <text class="colh" x="190" y="86">CLASSIC WEB APP</text>
  <text class="colh" x="534" y="86">API</text>

  <!-- ============ LEFT: browser-fronted ============ -->
  <rect class="node" x="40" y="104" width="116" height="48" rx="8"/>
  <text class="nodeh" x="98" y="126">User</text>
  <text class="nodes" x="98" y="142">a person</text>

  <path class="arrowG" d="M98,152 L98,172" marker-end="url(#wahG)"/>

  <rect class="shield" x="40" y="176" width="280" height="72" rx="8"/>
  <text class="shieldh" x="180" y="198">Browser applies client-side controls</text>
  <text class="shieldl" x="180" y="218">Same-origin · SameSite cookies</text>
  <text class="shieldl" x="180" y="234">CSP · CSRF tokens</text>

  <path class="arrowG" d="M180,248 L180,268" marker-end="url(#wahG)"/>

  <rect class="srv" x="100" y="272" width="160" height="44" rx="8"/>
  <text class="srvh" x="180" y="299">Authorize objects</text>

  <!-- ============ RIGHT: raw API ============ -->
  <rect class="raw" x="400" y="104" width="280" height="48" rx="8"/>
  <text class="rawh" x="540" y="124">Attacker-controlled client</text>
  <text class="rawl" x="540" y="142">curl · Postman · script · modified app</text>

  <path class="arrowA" d="M540,152 L540,172" marker-end="url(#wahA)"/>

  <rect class="raw" x="440" y="176" width="200" height="56" rx="8"/>
  <text class="rawh" x="540" y="198">No browser controls here</text>
  <text class="rawl" x="540" y="218" style="font-style:italic">fields are attacker-chosen</text>

  <path class="arrowA" d="M540,232 L540,268" marker-end="url(#wahA)"/>

  <rect class="srv" x="460" y="272" width="160" height="44" rx="8"/>
  <text class="srvh" x="540" y="293">Raw JSON endpoint</text>
  <text class="rawl" x="540" y="309">= API attack surface</text>

  <!-- ============ TWO CONSEQUENCES ============ -->
  <rect class="conseq" x="30" y="336" width="328" height="34" rx="7"/>
  <rect class="conseqacc" x="30" y="336" width="5" height="34" rx="2.5"/>
  <text class="conseqt" x="48" y="351">Object IDs in request paths</text>
  <text class="conseql" x="48" y="365">change an ID → possible BOLA</text>

  <rect class="conseq" x="362" y="336" width="328" height="34" rx="7"/>
  <rect class="conseqacc" x="362" y="336" width="5" height="34" rx="2.5"/>
  <text class="conseqt" x="380" y="351">client can send any field</text>
  <text class="conseql" x="380" y="365">bind the whole body → mass assignment</text>

  <!-- ============ BANNER ============ -->
  <rect class="banner" x="30" y="382" width="660" height="38" rx="8"/>
  <text class="bant" x="48" y="399">Browser controls are not API authorization.</text>
  <text class="banl" x="48" y="415">Verify identity, object access and bindable fields on the server.</text>
</svg>
